spring.application.name=MS-API-Gateway01


# Server Port
server.port=3333

# Application Name
#spring.application.name=CLOUD-API-GATEWAY

# Route 1 - Welcome API
spring.cloud.gateway.server.webflux.routes[0].id=welcome-api
spring.cloud.gateway.server.webflux.routes[0].uri=lb://MS-WELCOME-API-01
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/welcome

# Route 2 - Greet API
spring.cloud.gateway.server.webflux.routes[1].id=greet-api
spring.cloud.gateway.server.webflux.routes[1].uri=lb://MS-GREET-API-1
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/greet