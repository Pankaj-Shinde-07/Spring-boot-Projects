<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:#f8f8f8;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:420px;
    background:#fff;
    padding:45px;
    border-radius:15px;
    box-shadow:0 15px 35px rgba(0,0,0,.1);
}

.logo{
    text-align:center;
    font-size:34px;
    margin-bottom:15px;
}

.logo span{
    color:#611f69;
}

h2{
    text-align:center;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:30px;
    font-size:14px;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:7px;
    font-weight:600;
}

.input-group input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    transition:.3s;
}

.input-group input:focus{
    outline:none;
    border-color:#611f69;
    box-shadow:0 0 5px rgba(97,31,105,.3);
}

button{
    width:100%;
    padding:15px;
    background:#611f69;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#4a154b;
}

.divider{
    text-align:center;
    margin:25px 0;
    color:#777;
    position:relative;
}

.divider::before,
.divider::after{
    content:"";
    position:absolute;
    top:50%;
    width:40%;
    height:1px;
    background:#ddd;
}

.divider::before{
    left:0;
}

.divider::after{
    right:0;
}

.social-btn{
    width:100%;
    padding:13px;
    margin-bottom:12px;
    border:1px solid #ccc;
    border-radius:8px;
    background:white;
    cursor:pointer;
    font-size:15px;
    transition:.3s;
}

.social-btn:hover{
    background:#f4f4f4;
}

.login-link{
    text-align:center;
    margin-top:20px;
    font-size:14px;
}

.login-link a{
    color:#1264a3;
    text-decoration:none;
    font-weight:600;
}

.login-link a:hover{
    text-decoration:underline;
}

.error{
    color:red;
    text-align:center;
    margin-bottom:15px;
}

.success{
    color:green;
    text-align:center;
    margin-bottom:15px;
}

</style>

</head>

<body>

<div class="container">

    <div class="logo">
        <span>✦</span> Workspace
    </div>

    <h2>Create your account</h2>

    <p class="subtitle">
        Enter your details to continue
    </p>

    <!-- Success Message -->
    <p class="success" th:text="${successMsg}"></p>

    <!-- Error Message -->
    <p class="error" th:text="${errorMsg}"></p>

    <form action="/register" method="post">

        <div class="input-group">
            <label>Full Name</label>
            <input
                type="text"
                name="name"
                placeholder="John Doe"
                required>
        </div>

        <div class="input-group">
            <label>Email</label>
            <input
                type="email"
                name="email"
                placeholder="name@example.com"
                required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required>
        </div>

        <div class="input-group">
            <label>Confirm Password</label>
            <input
                type="password"
                name="confirmPassword"
                placeholder="Confirm password"
                required>
        </div>

        <button type="submit">
            Create Account
        </button>

    </form>

    <div class="divider">
        OR
    </div>

    <button class="social-btn">
        Continue with Google
    </button>

    <button class="social-btn">
        Continue with GitHub
    </button>

    <div class="login-link">
        Already have an account?
        <a href="/login">Sign in</a>
    </div>

</div>

</body>
</html>
