<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>User Registration</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

	<div class="container mt-5">

		<div class="row justify-content-center">

			<div class="col-md-6">

				<div class="card shadow">

					<div class="card-header text-center">
						<h3>User Registration</h3>
					</div>

					<div class="card-body">

						<p class="text-success" th:text="${successMsg}"></p>

						<form th:action="@{/register}" th:object="${user}" method="post">

							<div class="mb-3">

								<label>Name</label>

								<input type="text" class="form-control" th:field="*{name}">

								<small class="text-danger" th:errors="*{name}"></small>

							</div>

							<div class="mb-3">

								<label>Email</label>

								<input type="email" class="form-control" th:field="*{email}">

								<small class="text-danger" th:errors="*{email}"></small>

							</div>

							<div class="mb-3">

								<label>Mobile</label>

								<input type="text" class="form-control" th:field="*{mobile}">

								<small class="text-danger" th:errors="*{mobile}"></small>

							</div>

							<div class="mb-3">

								<label>Password</label>

								<input type="password" class="form-control" th:field="*{password}">

								<small class="text-danger" th:errors="*{password}"></small>

							</div>

							<button class="btn btn-primary w-100">
								Register
							</button>

						</form>

					</div>

				</div>

			</div>

		</div>

	</div>

</body>

</html>
